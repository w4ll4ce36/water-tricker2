<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<title>SWテスト</title>
<style>
body{font-family:sans-serif;padding:24px;line-height:1.6}
button{font-size:18px;padding:12px 18px}
#result{margin-top:20px;padding:14px;background:#f3f3f3;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Service Worker テスト</h1>
<p>通知やSupabaseは使いません。Service WorkerがiPhoneのホーム画面アプリで登録できるかだけ確認します。</p>
<button id="test">Service Workerを登録</button>
<div id="result">未実行</div>
<script>
const result=document.getElementById("result");
document.getElementById("test").addEventListener("click",async()=>{
  result.textContent="登録中...";
  try{
    if(!window.isSecureContext) throw new Error("HTTPSではありません");
    if(!("serviceWorker" in navigator)) throw new Error("Service Worker APIがありません");
    const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;
    result.textContent="✅ 成功\n\nScope:\n"+reg.scope;
  }catch(e){
    result.textContent="❌ 失敗\n\n名前: "+e.name+"\nメッセージ: "+e.message+"\n\n詳細:\n"+String(e);
    console.error(e);
  }
});
</script>
</body>
</html>
